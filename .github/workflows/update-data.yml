name: Update Beach Water Quality Data

on:
  schedule:
    # Every day at 08:30 HKT (00:30 UTC) — EPD updates water quality weekly, daily keeps it fresh
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-beach
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest beach water quality
        run: python fetch_beach_data.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: daily update beach water quality data'
          file_pattern: public/beach_data.geojson
          skip_dirty: false